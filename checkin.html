<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>셀프 체크인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#08080c;--bg-base:#0e0e14;--bg-surface:#16161f;--bg-card:#1c1c28;--bg-card-hover:#24242f;--bg-elevated:#2a2a38;--gold:#c9a84c;--gold-light:#e8d48b;--gold-dim:#8a7633;--gold-glow:rgba(201,168,76,.15);--gold-glow-strong:rgba(201,168,76,.3);--text-primary:#f0ede6;--text-secondary:#918d84;--text-muted:#5c5950;--text-inverse:#08080c;--status-seat:#5ce0a0;--status-seat-bg:rgba(92,224,160,.12);--status-warn:#f5a623;--status-urgent:#ef4444;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--shadow-elevated:0 8px 32px rgba(0,0,0,.4);--shadow-gold:0 0 28px rgba(201,168,76,.25);--transition:.2s cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;width:100%;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,168,76,.07),transparent 60%),var(--bg-deep);color:var(--text-primary);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px}
.kiosk{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:28px 22px}
.k-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:10px}
.k-top .brand{font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);letter-spacing:4px;text-transform:uppercase}
.k-top .counter{font-size:12px;color:var(--text-muted)}.k-top .counter b{color:var(--gold);font-weight:700}
.k-title{text-align:center;flex-shrink:0;margin:8px 0 18px}
.k-title h1{font-size:30px;font-weight:700;margin-bottom:6px}
.k-title p{font-size:14px;color:var(--text-secondary)}
.search-wrap{flex-shrink:0;position:relative;margin-bottom:14px}
.search-wrap input{width:100%;padding:20px 56px 20px 24px;font-size:24px;font-weight:600;text-align:center;background:var(--bg-surface);border:2px solid rgba(201,168,76,.25);border-radius:var(--radius-lg);color:var(--text-primary);font-family:inherit;outline:none;transition:var(--transition)}
.search-wrap input::placeholder{color:var(--text-muted);font-weight:400;font-size:18px}
.search-wrap input:focus{border-color:var(--gold);box-shadow:var(--shadow-gold)}
.search-wrap .clr{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-elevated);color:var(--text-secondary);font-size:18px;cursor:pointer;display:none}
.search-wrap .clr.show{display:flex;align-items:center;justify-content:center}
.results{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.r-guide{text-align:center;color:var(--text-muted);padding-top:40px;font-size:15px;line-height:1.8}
.r-guide .big{font-size:44px;margin-bottom:14px;opacity:.5}
.r-card{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--bg-card);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-md);cursor:pointer;transition:var(--transition)}
.r-card:active{transform:scale(.985);background:var(--bg-card-hover)}
.r-card.done{opacity:.55}
.r-card .rc-left{flex:1;min-width:0}
.r-card .rc-name{font-size:22px;font-weight:700;margin-bottom:3px}
.r-card .rc-meta{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-card .rc-meta .dot{margin:0 7px;color:var(--text-muted)}
.r-card .rc-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.r-card .rc-seat{font-size:13px;color:var(--gold-light);font-weight:600}
.r-card .rc-badge{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.r-card .rc-badge.go{background:var(--gold);color:var(--text-inverse)}
.r-card .rc-badge.done{background:var(--status-seat-bg);color:var(--status-seat)}
.numpad{flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.numpad button{padding:16px 0;font-size:24px;font-weight:600;background:var(--bg-surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-md);color:var(--text-primary);font-family:inherit;cursor:pointer;transition:var(--transition)}
.numpad button:active{background:var(--gold-glow-strong);border-color:var(--gold-dim)}
.numpad button.np-back{color:var(--status-warn)}

/* 확인 다이얼로그 */
.overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.confirm-card{background:var(--bg-card);border:1px solid rgba(201,168,76,.25);border-radius:var(--radius-lg);padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-elevated)}
.confirm-card .cc-q{font-size:16px;color:var(--text-secondary);margin-bottom:12px}
.confirm-card .cc-name{font-size:34px;font-weight:700;margin-bottom:8px}
.confirm-card .cc-meta{font-size:15px;color:var(--text-secondary);margin-bottom:8px}
.confirm-card .cc-seat{font-size:18px;color:var(--gold-light);font-weight:600;margin-bottom:28px}
.confirm-card .cc-btns{display:flex;gap:12px}
.confirm-card .cc-btns button{flex:1;padding:18px;font-size:18px;font-weight:700;border-radius:var(--radius-md);border:none;cursor:pointer;font-family:inherit;transition:var(--transition)}
.cc-no{background:var(--bg-elevated);color:var(--text-secondary)}
.cc-yes{background:var(--gold);color:var(--text-inverse)}.cc-yes:active{transform:scale(.97)}

/* 완료 화면 */
.done-screen{display:none;position:fixed;inset:0;z-index:9500;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(201,168,76,.12),transparent 60%),var(--bg-deep);animation:fadeIn .4s ease}
.done-screen.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.done-screen .check{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:60px;color:var(--text-inverse);margin-bottom:28px;animation:pop .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.done-screen .d-welcome{font-size:20px;color:var(--text-secondary);margin-bottom:8px}
.done-screen .d-name{font-size:48px;font-weight:700;margin-bottom:20px}
.done-screen .d-seat-box{background:var(--bg-card);border:1px solid rgba(201,168,76,.25);border-radius:var(--radius-lg);padding:22px 40px;margin-bottom:14px}
.done-screen .d-seat-label{font-size:14px;color:var(--text-secondary);margin-bottom:6px}
.done-screen .d-seat{font-size:40px;font-weight:700;color:var(--gold-light)}
.done-screen .d-msg{font-size:16px;color:var(--text-secondary);margin-top:10px}
.done-screen .d-already{color:var(--status-warn);font-size:15px;margin-top:8px}
.done-screen .d-timer{position:absolute;bottom:36px;font-size:13px;color:var(--text-muted)}
.done-screen .d-home{margin-top:30px;padding:14px 40px;font-size:16px;font-weight:700;border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:999px;cursor:pointer;font-family:inherit}

.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 24px;background:var(--bg-elevated);border:1px solid var(--gold-dim);border-radius:var(--radius-md);font-size:15px;box-shadow:var(--shadow-elevated)}
.toast.error{border-color:#e05050}
/* ── 명찰 인쇄 (전용 라벨프린터) ── */
#badgePrint{display:none}
.badge-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#000;text-align:center;padding:3mm;box-sizing:border-box}
.bp-event{font-size:9pt;color:#555;margin-bottom:1mm}
.bp-name{font-size:30pt;font-weight:900;line-height:1.1;letter-spacing:1px}
.bp-org{font-size:12pt;color:#222;margin-top:1.5mm;line-height:1.25}
.bp-seat{font-size:13pt;font-weight:700;margin-top:2mm;padding:1mm 4mm;border:1.2pt solid #000;border-radius:3mm}
.d-print{margin-top:14px;padding:14px 32px;font-size:16px;font-weight:700;border:1px solid var(--gold);background:var(--gold-glow);color:var(--gold-light);border-radius:999px;cursor:pointer;font-family:inherit}
@media print{
  body > *{display:none !important;}
  #badgePrint{display:block !important;position:fixed;inset:0;width:100%;height:100%;background:#fff}
}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="kiosk">
  <div class="k-top">
    <span class="brand">Self Check-in</span>
    <span class="counter">체크인 <b id="cntChecked">–</b> / <span id="cntTotal">–</span></span>
  </div>
  <div class="k-title">
    <h1>참석자 확인</h1>
    <p>성함 또는 휴대폰 뒷 4자리를 입력해주세요</p>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="예: 홍길동  또는  5678" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clr" id="clrBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="results" id="results">
    <div class="r-guide"><div class="big">👋</div>성함을 입력하면 이름으로,<br>숫자를 입력하면 휴대폰 뒷자리로 찾습니다.<br>둘 다 입력하면 더 정확하게 찾을 수 있어요.</div>
  </div>

  <div class="numpad" id="numpad">
    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
    <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
    <button class="np-back" onclick="backspace()">⌫</button><button onclick="press('0')">0</button><button class="np-back" onclick="clearSearch()">전체삭제</button>
  </div>
</div>

<!-- 본인 확인 -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="cc-q">본인이 맞으신가요?</div>
    <div class="cc-name" id="ccName"></div>
    <div class="cc-meta" id="ccMeta"></div>
    <div class="cc-seat" id="ccSeat"></div>
    <div class="cc-btns">
      <button class="cc-no" onclick="closeConfirm()">아니요</button>
      <button class="cc-yes" id="ccYes">네, 체크인</button>
    </div>
  </div>
</div>

<!-- 완료 -->
<div class="done-screen" id="doneScreen">
  <div class="check">✓</div>
  <div class="d-welcome">환영합니다</div>
  <div class="d-name" id="doneName"></div>
  <div class="d-seat-box" id="doneSeatBox">
    <div class="d-seat-label">좌석</div>
    <div class="d-seat" id="doneSeat"></div>
  </div>
  <div class="d-msg">즐거운 시간 되세요 🎉</div>
  <div class="d-already" id="doneAlready"></div>
  <button class="d-print" onclick="printBadge(lastDonePerson)">🖨 명찰 다시 인쇄</button>
  <button class="d-home" onclick="goHome()">처음으로</button>
  <div class="d-timer" id="doneTimer"></div>
</div>

<!-- 명찰 인쇄 영역 (화면엔 안 보이고 인쇄 시에만) -->
<div id="badgePrint"><div class="badge-inner">
  <div class="bp-event" id="bpEvent"></div>
  <div class="bp-name" id="bpName"></div>
  <div class="bp-org" id="bpOrg"></div>
  <div class="bp-seat" id="bpSeat"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL      = 'https://lzfsowysybisuisaasoa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Na6u1HFFeoSrEkw_NTSytw_cZmIrcHi';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ── 명찰 설정 (라벨 규격에 맞춰 조정) ── */
  const EVENT_NAME  = '서울특별시사회복지사협회';  // 명찰 상단 행사/기관명
  const BADGE_W_MM  = 62;    // 라벨 가로(mm) — 사용하는 롤 라벨 폭
  const BADGE_H_MM  = 40;    // 라벨 세로(mm)
  const AUTO_PRINT  = true;  // 체크인 완료 시 명찰 자동 인쇄 (false면 버튼으로만)
</script>
<script>
var searchTimer=null, doneTimer=null, idleTimer=null, selected=null, lastDonePerson=null;
var input=document.getElementById('searchInput');

// ── 명찰 인쇄 ──
function setBadgePage(){
  var st=document.getElementById('badgePageStyle');
  if(!st){ st=document.createElement('style'); st.id='badgePageStyle'; document.head.appendChild(st); }
  st.textContent='@page{size:'+BADGE_W_MM+'mm '+BADGE_H_MM+'mm;margin:0}';
}
function printBadge(a){
  if(!a) return;
  setBadgePage();
  document.getElementById('bpEvent').textContent=EVENT_NAME;
  document.getElementById('bpName').textContent=a.name||'';
  document.getElementById('bpOrg').textContent=a.org||'';
  document.getElementById('bpSeat').textContent=a.table_no?('좌석 '+a.table_no):'';
  window.print();
}

// ── 입력 ──
input.addEventListener('input',onInput);
function onInput(){
  document.getElementById('clrBtn').classList.toggle('show', !!input.value);
  clearTimeout(searchTimer);
  searchTimer=setTimeout(doSearch,300);
  resetIdle();
}
function press(d){ input.value+=d; onInput(); }
function backspace(){ input.value=input.value.slice(0,-1); onInput(); }
function clearSearch(){ input.value=''; onInput(); input.focus(); }

// ── 검색: 이름(문자) + 뒷자리(숫자) 조합 ──
async function doSearch(){
  var q=input.value.trim();
  var box=document.getElementById('results');
  if(!q){
    box.innerHTML='<div class="r-guide"><div class="big">👋</div>성함을 입력하면 이름으로,<br>숫자를 입력하면 휴대폰 뒷자리로 찾습니다.<br>둘 다 입력하면 더 정확하게 찾을 수 있어요.</div>';
    return;
  }
  var digits=q.replace(/[^0-9]/g,'');
  var name=q.replace(/[0-9\s\-]/g,'');
  if(!name && digits.length<2){
    box.innerHTML='<div class="r-guide">조금 더 입력해주세요</div>';
    return;
  }
  try{
    var query=sb.from('attendees').select('*');
    if(name)   query=query.ilike('name','%'+name+'%');
    if(digits) query=query.like('phone','%'+digits);
    query=query.order('name',{ascending:true}).limit(40);
    var r=await query;
    if(r.error) throw r.error;
    renderResults(r.data||[]);
  }catch(e){ box.innerHTML='<div class="r-guide">검색 오류: '+(e.message||e)+'</div>'; }
}

function maskPhone(p){ if(!p)return''; var d=String(p).replace(/[^0-9]/g,''); if(d.length<4)return''; return '···'+d.slice(-4); }

function renderResults(list){
  var box=document.getElementById('results');
  if(!list.length){
    box.innerHTML='<div class="r-guide"><div class="big">🔎</div>검색 결과가 없습니다.<br>성함 또는 뒷자리를 다시 확인해주세요.<br><span style="font-size:13px">현장 등록이 필요하면 안내데스크로 문의해주세요.</span></div>';
    return;
  }
  box.innerHTML=list.map(function(a){
    var done=a.checked_in;
    var meta=[a.org, maskPhone(a.phone)].filter(Boolean).join('<span class="dot">·</span>');
    var seat=a.table_no?'<div class="rc-seat">좌석 '+a.table_no+'</div>':'';
    var badge=done?'<div class="rc-badge done">완료</div>':'<div class="rc-badge go">체크인</div>';
    return '<div class="r-card '+(done?'done':'')+'" onclick="pick('+a.id+')">'
      +'<div class="rc-left"><div class="rc-name">'+esc(a.name)+'</div><div class="rc-meta">'+meta+'</div></div>'
      +'<div class="rc-right">'+seat+badge+'</div></div>';
  }).join('');
}

// ── 본인 확인 ──
var cache={};
function pick(id){
  var box=document.getElementById('results');
  // 현재 렌더된 목록에서 찾기 위해 재조회 대신 빠르게 단건 조회
  sb.from('attendees').select('*').eq('id',id).single().then(function(r){
    if(r.error||!r.data){ showToast('정보를 불러오지 못했습니다',true); return; }
    selected=r.data;
    document.getElementById('ccName').textContent=r.data.name;
    document.getElementById('ccMeta').textContent=[r.data.org,maskPhone(r.data.phone)].filter(Boolean).join('  ·  ');
    document.getElementById('ccSeat').textContent=r.data.table_no?'좌석 '+r.data.table_no:'';
    document.getElementById('confirmOverlay').classList.add('show');
    resetIdle();
  });
}
function closeConfirm(){ document.getElementById('confirmOverlay').classList.remove('show'); selected=null; }

document.getElementById('ccYes').onclick=async function(){
  if(!selected) return;
  var btn=this; btn.disabled=true; btn.textContent='처리 중...';
  try{
    var r=await sb.rpc('checkin_attendee',{p_id:selected.id});
    if(r.error) throw r.error;
    showDone(selected, r.data && r.data.already);
  }catch(e){ showToast('체크인 실패: '+(e.message||e),true); }
  finally{ btn.disabled=false; btn.textContent='네, 체크인'; }
};

// ── 완료 화면 ──
function showDone(a, already){
  document.getElementById('confirmOverlay').classList.remove('show');
  document.getElementById('doneName').textContent=a.name+' 님';
  var seatBox=document.getElementById('doneSeatBox');
  if(a.table_no){ document.getElementById('doneSeat').textContent=a.table_no; seatBox.style.display='block'; }
  else seatBox.style.display='none';
  document.getElementById('doneAlready').textContent=already?'(이미 체크인된 분입니다)':'';
  document.getElementById('doneScreen').classList.add('show');
  refreshCounter();
  lastDonePerson=a;
  if(AUTO_PRINT) setTimeout(function(){ printBadge(a); },450);
  // 8초 카운트다운 후 자동 복귀
  var left=8;
  document.getElementById('doneTimer').textContent=left+'초 후 처음 화면으로';
  clearInterval(doneTimer);
  doneTimer=setInterval(function(){
    left--;
    document.getElementById('doneTimer').textContent=left+'초 후 처음 화면으로';
    if(left<=0) goHome();
  },1000);
}
function goHome(){
  clearInterval(doneTimer);
  document.getElementById('doneScreen').classList.remove('show');
  selected=null;
  clearSearch();
}

// ── 카운터 ──
async function refreshCounter(){
  try{
    var t=await sb.from('attendees').select('*',{count:'exact',head:true});
    var c=await sb.from('attendees').select('*',{count:'exact',head:true}).eq('checked_in',true);
    if(!t.error) document.getElementById('cntTotal').textContent=(t.count||0);
    if(!c.error) document.getElementById('cntChecked').textContent=(c.count||0);
  }catch(e){}
}

// ── 유휴 시 초기화 (60초 무입력) ──
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){
    if(!document.getElementById('doneScreen').classList.contains('show')){
      closeConfirm(); clearSearch();
    }
  },60000);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m,e){var c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast'+(e?' error':'');t.textContent=m;c.appendChild(t);setTimeout(function(){t.remove();},3000);}

refreshCounter();
setInterval(refreshCounter,30000);
input.focus();
</script>
</body>
</html>
